en:
  theme_metadata:
    description: Renders an events calendar or upcoming events sidebar on custom topic list pages created with Discourse Custom Topic Lists
    settings:
      list_pages:
        description: "Lists themselves are created and managed with Discourse Custom Topic Lists (https://meta.discourse.org/t/discourse-custom-topic-lists/311186). Add a row here for each list that should show the events calendar or upcoming events sidebar. Enter the list's slug from Custom Topic Lists (e.g. events for /lists/events)."
        schema:
          properties:
            slug:
              label: "List slug"
              description: "Slug of the list in Custom Topic Lists, e.g. events for /lists/events"
            layout:
              label: "Layout"
              description: "Full calendar, or an upcoming events sidebar"
            new_button:
              label: "Show new button"
              description: "Add a New button to the list's navigation bar. The composer opens blank."
            new_label:
              label: "New button label"
              description: "Button text, e.g. New Event. The composer buttons follow it (Create Event). Empty means New Topic."
            new_icon:
              label: "New button icon"
              description: "Pick an icon, e.g. calendar-plus. Empty means the pen icon. Phones show only the icon."
            hide_sidebar_button:
              label: "Hide Horizon sidebar button"
              description: "Horizon only. Hide the sidebar New Topic button on this page. Otherwise it matches the button above."
            new_event:
              label: "Start with an event"
              description: "New topics open with an event block starting at the next full hour, lasting an hour."
            new_category:
              label: "New button category"
              description: "Optional. New topics default to this category, including from the sidebar button and the c shortcut."
            hide_topic_list:
              label: "Hide topic list"
              description: "Hide the standard topic list on this page"
  upcoming_events:
    heading: "Upcoming events"
    view_all: "View all"
    empty: "No upcoming events"
