en:
  theme_metadata:
    description: Renders an events calendar or upcoming events sidebar on custom topic list pages created with Discourse Custom Topic Lists
    settings:
      list_pages:
        description: "Lists themselves are created and managed with Discourse Custom Topic Lists (https://meta.discourse.org/t/discourse-custom-topic-lists/311186). Add a row here for each list that should show the events calendar or upcoming events sidebar. Enter the list's slug from Custom Topic Lists (e.g. events for /lists/events)."
        schema:
          properties:
            slug:
              label: "List slug"
              description: "The slug of the list as set in Custom Topic Lists, e.g. events for /lists/events"
            layout:
              label: "Layout"
              description: "Full calendar, or upcoming events sidebar"
            new_button:
              label: "Show new button"
              description: "Show a button above the list for creating a new topic or event. The composer opens with the list's single category and tags filled in when its Custom Topic Lists query sets them."
            new_label:
              label: "New button label"
              description: "Text of the button, for example New event. Leave empty for New Topic."
            new_type:
              label: "New button type"
              description: "Topic opens a plain composer. Event adds an event block that starts at the next full hour."
            events_only:
              label: "Only topics with events"
              description: "Hide topics in the list that have no event object, such as archive posts. They are hidden in the browser, so the list's paging still counts them."
            hide_topic_list:
              label: "Hide topic list"
              description: "Hide the standard topic list on this page"
  upcoming_events:
    heading: "Upcoming events"
    view_all: "View all"
    empty: "No upcoming events"
