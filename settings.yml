list_pages:
  type: objects
  default: []
  schema:
    name: list page
    identifier: slug
    properties:
      slug:
        type: string
        required: true
        validations:
          min_length: 1
      layout:
        type: enum
        required: true
        choices:
          - calendar
          - sidebar
      new_button:
        type: boolean
      new_label:
        type: string
      new_icon:
        type: icon
      hide_sidebar_button:
        type: boolean
      new_event:
        type: boolean
      new_category:
        type: categories
        validations:
          max: 1
      hide_topic_list:
        type: boolean
