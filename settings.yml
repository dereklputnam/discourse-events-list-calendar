list_pages:
  type: objects
  default: []
  schema:
    name: list page
    identifier: slug
    properties:
      slug:
        type: string
        required: true
        validations:
          min_length: 1
      layout:
        type: enum
        required: true
        choices:
          - calendar
          - sidebar
      new_button:
        type: boolean
      new_label:
        type: string
      events_only:
        type: boolean
      hide_topic_list:
        type: boolean
